name: Check Base Image Updates

on:
  schedule:
    # 每天 UTC 时间 0:00 运行 (北京时间 8:00)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  check-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get current base image digest
        id: current
        run: |
          # 从 Dockerfile 获取当前基础镜像的 digest（如果存在）
          if grep -q '@sha256:' Dockerfile; then
            CURRENT_DIGEST=$(grep 'FROM n8nio/n8n' Dockerfile | cut -d'@' -f2)
            echo "digest=${CURRENT_DIGEST}" >> $GITHUB_OUTPUT
          else
            echo "digest=none" >> $GITHUB_OUTPUT
          fi

      - name: Get latest base image digest
        id: latest
        run: |
          # 获取 n8nio/n8n:latest 的最新 digest
          LATEST_DIGEST=$(docker pull n8nio/n8n:latest > /dev/null 2>&1 && docker inspect n8nio/n8n:latest --format='{{.RepoDigests}}' | grep -oP 'sha256:[a-f0-9]{64}')
          echo "digest=${LATEST_DIGEST}" >> $GITHUB_OUTPUT
          echo "Latest n8nio/n8n digest: ${LATEST_DIGEST}"

      - name: Compare digests
        id: compare
        run: |
          if [ "${{ steps.current.outputs.digest }}" = "none" ]; then
            echo "No digest found in Dockerfile, will update"
            echo "updated=true" >> $GITHUB_OUTPUT
          elif [ "${{ steps.current.outputs.digest }}" != "${{ steps.latest.outputs.digest }}" ]; then
            echo "Base image has been updated"
            echo "updated=true" >> $GITHUB_OUTPUT
          else
            echo "Base image is up to date"
            echo "updated=false" >> $GITHUB_OUTPUT
          fi

      - name: Update Dockerfile with new digest
        if: steps.compare.outputs.updated == 'true'
        run: |
          # 更新 Dockerfile 使用新的 digest
          sed -i "s|FROM n8nio/n8n.*|FROM n8nio/n8n@${{ steps.latest.outputs.digest }}|" Dockerfile

      - name: Trigger build workflow (alternative)
        if: steps.compare.outputs.updated == 'true'
        run: |
          # 如果你不想创建 PR，可以直接触发构建
          gh workflow run docker-build.yml
          echo "Base image updated, PR created or build triggered"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
